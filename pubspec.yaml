name: smart_farmer_procurement
description: "Smart Farmer Procurement Platform Mobile Application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  # Moved Isar packages here
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  path_provider: ^2.1.1
  mobile_scanner: ^4.0.1
  qr_flutter: ^4.1.0
  url_launcher: ^6.2.5
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Merged build tools here
  build_runner: ^2.4.6
  isar_generator: ^3.1.0 
  flutter_launcher_icons: ^0.13.1

flutter:
  generate: true
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/appicon.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#E8F5E9" # Matching your mint green background
  adaptive_icon_foreground: "assets/icons/appicon.jpg"